[project]
name = "reflection-agent"
version = "0.1.0"
description = "Reflection agent project"
authors = [
    {name = "robin-ochieng",email = "robinochieng73@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "langchain (>=1.0.2,<2.0.0)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "langgraph (>=1.0.1,<2.0.0)",
    "streamlit (>=1.50.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
